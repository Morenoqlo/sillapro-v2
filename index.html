<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SillaPro · Software para barberías en Chile</title>
    <meta
      name="description"
      content="Agenda, cobros y reservas online para barberías. Tus clientes reservan solos, tú cobras en segundos. Empieza 14 días gratis sin tarjeta."
    />
    <link rel="canonical" href="https://sillapro-v2.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SillaPro" />
    <meta property="og:title" content="SillaPro · Software para barberías en Chile" />
    <meta
      property="og:description"
      content="Agenda, cobros y reservas online. 14 días gratis, sin tarjeta."
    />
    <meta property="og:url" content="https://sillapro-v2.vercel.app/" />
    <meta property="og:locale" content="es_CL" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SillaPro · Software para barberías" />
    <meta
      name="twitter:description"
      content="Agenda, cobros y reservas online. 14 días gratis."
    />

    <!-- Performance: hint the browser to open the Supabase TLS connection in
         parallel with the JS bundle download. Vite substitutes the env var
         at build time so we don't hardcode the project ref. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- PWA + mobile -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SillaPro" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
